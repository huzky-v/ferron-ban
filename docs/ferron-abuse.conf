{
    log "/var/log/ferron/access.log"
    error_log "/var/log/ferron/error.log"
    ban_mode true
    honeypot_mode true
    # Default false. Enable on a real WordPress site to allow core WordPress routes
    # and remove "php" from the effective extension-ban list for that site.
    wordpress_site false
    # Defaults to true: bans from one protected site apply to other sites.
    # Set share_bans false on a site to isolate its bans.
    share_bans true
    # Default none. Cloudflare mode fetches its published IPv4/IPv6 ranges at
    # startup and trusts CF-Connecting-IP only from a Cloudflare connecting peer.
    # proxied_by cloudflare
    ban_duration "15m"
    # Optional: ban PHP probes immediately, before definitions or honeypots.
    # With ban_mode enabled, list strings separated by spaces (e.g. "php" "asp").
    # Each is 1-32 ASCII letters/digits starting with a letter; one leading dot is optional.
    ban_extensions "php"
    # Alternative: definitions_bundle "default" uses
    # /var/lib/ferron/abuse-bundle.zip. A local ZIP path or HTTPS URL also works.
    # When enabled, the bundle replaces definitions_db, definitions_url, and
    # honeypot_templates_dir. See honeypot-responses.md for the ZIP layout.
    # SQLite is authoritative for definitions; schema initialization inserts no rules.
    definitions_db "/var/lib/ferron/attack-definitions.sqlite"
    # Mount this external directory read-only; templates are not image-bundled.
    # Provide one YAML for every enabled id_leak definition in SQLite.
    # DB rows and templates can be updated without rebuilding the image.
    honeypot_templates_dir "/etc/ferron/honeypot-responses"
    audit_log "/var/log/ferron/unmatched-banned.ndjson"
    # Optional Apache combined-format rule-hit log; extra fields are proxy_ip
    # ("-" for direct traffic), Host, and rule name ("wp-ban" or "extban").
    # no_log definitions (including /favicon.ico) are omitted from both logs.
    matched_log "/var/log/ferron/matched.log"
    # Optional global IP blocklist, also usable by itself without the definition
    # settings above. Fetches in the background; ipban_log is required when on.
    # ipban_mode true
    # ipban_log "/var/log/ferron/ipban.log"
    # ipban_interval "24h"
    # ipban_url "https://raw.githubusercontent.com/borestad/blocklist-abuseipdb/refs/heads/main/abuseipdb-s100-14d.ipv4"
    default_http_port 8080
    default_https_port 8443
}

*:8080 {
    root "/var/www/static"
    # Site blocks can override ban_mode, honeypot_mode, wordpress_site, share_bans,
    # ban_duration, ban_extensions, audit_log, and matched_log.
    # Definition sources and honeypot_templates_dir remain global-only.
    # ban_mode false
    # share_bans false
    # audit_log "/var/log/ferron/site-unmatched.ndjson"
}
