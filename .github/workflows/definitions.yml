name: Publish attack-def.zip

on:
  push:
    branches: [main]
    paths:
      - docs/database/attack-definitions-snapshot-v1.sql
      - honeypot-responses/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build definitions database
        run: |
          mkdir -p zip
          rm -f zip/definitions.sqlite
          sqlite3 -bail zip/definitions.sqlite '.read docs/database/attack-definitions-snapshot-v1.sql'

      - name: Package attack-def.zip
        run: |
          scratch="$(mktemp -d)"
          cp zip/definitions.sqlite "$scratch/"
          cp -R honeypot-responses "$scratch/"
          (cd "$scratch" && zip -r -X "$GITHUB_WORKSPACE/attack-def.zip" definitions.sqlite honeypot-responses)

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view definitions --repo "$GITHUB_REPOSITORY" \
            || gh release create definitions --repo "$GITHUB_REPOSITORY" \
                 --title "Attack definitions" --latest --target "$GITHUB_SHA"
          gh release upload definitions attack-def.zip --clobber --repo "$GITHUB_REPOSITORY"
