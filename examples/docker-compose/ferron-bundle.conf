{
    log /var/log/ferron/access.log
    error_log /var/log/ferron/error.log

    ban_mode true
    honeypot_mode true
    ban_duration "15m"
    # "default" reads the single read-only ZIP mounted by docker-compose.bundle.yml.
    definitions_bundle "default"
    audit_log "/var/log/ferron/unmatched-banned.ndjson"

    default_http_port 8080
    default_https_port 8443
}

www.example.com {
    proxy {
        upstream http://app:80
        algorithm two_random
    }
}

static.example.com:8080 {
    root /var/www/static
}

# For HTTPS/ACME, use the TLS block from ferron.conf and enable port 443
# in docker-compose.bundle.yml.
