{
    log /var/log/ferron/access.log
    error_log /var/log/ferron/error.log

    # --- Abuse protection (global-only directives) -------------------------
    # Every enabled attack definition immediately bans the client IP.
    ban_mode true
    # `id_leak` definitions (e.g. /.env, /.aws/credentials) return a decoy.
    honeypot_mode true
    ban_duration "15m"
    # With ban_mode enabled, ban PHP probes before definitions or honeypots.
    ban_extensions "php"
    # Legacy DB + directory configuration. Use ferron-bundle.conf instead with
    # docker-compose.bundle.yml; do not enable both sources for this example.
    definitions_db "/var/lib/ferron/attack-definitions.sqlite"
    # Externally provisioned read-only bind mount; not included in the image.
    # One YAML file is required for each enabled id_leak definition in SQLite.
    honeypot_templates_dir "/etc/ferron/honeypot-responses"
    # Optional one-shot HTTPS source fetched at startup, before loading:
    # definitions_url "https://security.example.invalid/attack-definitions.sqlite"
    # Append-only NDJSON of banned, unmatched requests (grep-able):
    audit_log "/var/log/ferron/unmatched-banned.ndjson"

    # Container runs as nonroot, so listen on high ports and map 80/443 on the
    # host (see docker-compose.yml). Needed for TLS portless host blocks.
    default_http_port 8080
    default_https_port 8443

    # --- Trusted upstream proxy (optional) ---------------------------------
    # When Cloudflare connects directly to Ferron, enable the following instead
    # of client_ip_from_header. Cloudflare ranges are fetched at startup.
    # proxied_by cloudflare
    # Only set this when a load balancer / CDN you control sits in front of
    # Ferron. Otherwise Ferron uses the direct peer IP, which is correct when
    # Ferron itself is the public edge. Never use 0.0.0.0/0.
    # client_ip_from_header x-forwarded-for {
    #     trusted_proxy "172.16.0.0/12"
    #     trusted_proxy "10.0.0.0/8"
    # }
}

# Reverse-proxy a site to the app container over the compose network.
# `proxy` automatically sets X-Forwarded-For / X-Forwarded-Proto / X-Real-IP.
www.example.com {
    proxy {
        upstream http://app:80
        # upstream http://app2:80          # add more for load balancing
        algorithm two_random
    }
}

# Static files served directly by Ferron (mount ./wwwroot into the container).
static.example.com:8080 {
    root /var/www/static
}

# --- HTTPS via Let's Encrypt (ACME HTTP-01) --------------------------------
# Remove the explicit ":8080" from the host blocks above when you enable this,
# so Ferron manages listeners from default_http_port / default_https_port.
# www.example.com {
#     proxy {
#         upstream http://app:80
#     }
#     tls {
#         provider acme
#         challenge http-01
#         contact "admin@example.com"
#         cache "/var/cache/ferron-acme"
#     }
# }
