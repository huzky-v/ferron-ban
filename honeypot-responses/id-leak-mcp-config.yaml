version: 1
name: id-leak-mcp-config
restype: json
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
fields:
  mcpServers:
    internal-tools:
      command: node
      args: ['/srv/services/mcp/server.js']
      env:
        INTERNAL_API_URL: 'https://api.${slug}.local'
        INTERNAL_API_TOKEN: '${token}'
