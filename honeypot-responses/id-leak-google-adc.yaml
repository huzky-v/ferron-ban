version: 1
name: id-leak-google-adc
restype: json
variables:
  project_prefix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 6}
  project_digits: {op: chars, alphabet: '0123456789', min: 6}
  client_digits: {op: chars, alphabet: '0123456789', min: 21}
  client_suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  secret: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 28}
  token_a: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  token_b: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 64}
fields:
  type: authorized_user
  client_id: '${client_digits}-${client_suffix}.apps.googleusercontent.com'
  client_secret: 'GOCSPX-${secret}'
  refresh_token: '1//0${token_a}-${token_b}'
  quota_project_id: '${project_prefix}-${project_digits}'
