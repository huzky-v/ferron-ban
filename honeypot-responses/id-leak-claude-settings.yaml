version: 1
name: id-leak-claude-settings
restype: json
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 40}
fields:
  permissions:
    allow: ['Bash(npm run build)', 'Bash(npm test)']
    deny: ['Read(.env)', 'Read(.aws/**)']
  env:
    INTERNAL_API_URL: 'https://api.${slug}.local'
    INTERNAL_API_TOKEN: '${token}'
