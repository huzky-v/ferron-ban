version: 1
name: id-leak-terraform-vars
restype: normal
variables:
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 20}
template: |
  environment = "production"
  db_password = "${password}"
  aws_access_key_id = "AKIA${key}"
  region = "us-east-1"
