version: 1
name: id-leak-jupyter-python-config
restype: normal
variables:
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
template: |
  c.ServerApp.ip = '0.0.0.0'
  c.ServerApp.port = 8888
  c.ServerApp.open_browser = False
  c.ServerApp.token = '${token}'
  c.JupyterHub.cookie_secret_file = '/etc/jupyterhub/cookie_secret'
