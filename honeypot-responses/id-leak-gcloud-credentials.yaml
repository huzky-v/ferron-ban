version: 1
name: id-leak-gcloud-credentials
restype: json
variables:
  refresh: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_, min: 96}
  client: {op: chars, alphabet: '0123456789', min: 21}
  expiry: {op: integer, min: 1798761600, max: 1798761700}
fields:
  client_id: '${client}'
  client_secret: '${refresh}'
  refresh_token: '${refresh}'
  token_expiry: '${expiry}'
  type: authorized_user
