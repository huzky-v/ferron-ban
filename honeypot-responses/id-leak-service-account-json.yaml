version: 1
name: id-leak-service-account-json
restype: json
variables:
  project_prefix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 6}
  project_digits: {op: chars, alphabet: '0123456789', min: 6}
  project: {op: format, value: '${project_prefix}-${project_digits}'}
  account_prefix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 6}
  account_suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 4}
  account: {op: format, value: '${account_prefix}-${account_suffix}'}
  email: {op: format, value: '${account}@${project}.iam.gserviceaccount.com'}
  encoded_email: {op: url_encode, value: '${email}'}
  key_id: {op: chars, alphabet: '0123456789abcdef', min: 40}
  client_id: {op: chars, alphabet: '0123456789', min: 21}
  pem: {op: pkcs8_rsa_pem}
fields:
  type: service_account
  project_id: '${project}'
  private_key_id: '${key_id}'
  private_key: '${pem}'
  client_email: '${email}'
  client_id: '${client_id}'
  auth_uri: https://accounts.google.com/o/oauth2/auth
  token_uri: https://oauth2.googleapis.com/token
  auth_provider_x509_cert_url: https://www.googleapis.com/oauth2/v1/certs
  client_x509_cert_url: 'https://www.googleapis.com/robot/v1/metadata/x509/${encoded_email}'
  universe_domain: googleapis.com
