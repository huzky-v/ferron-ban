version: 1
name: id-leak-openstack-secure-config
restype: normal
variables:
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  project: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 10}
template: |
  clouds:
    production:
      auth:
        auth_url: https://identity.${project}.cloud/v3
        username: deployer
        password: ${password}
        project_name: production
        user_domain_name: Default
        project_domain_name: Default
