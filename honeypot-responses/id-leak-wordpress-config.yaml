version: 1
name: id-leak-wordpress-config
restype: normal
variables:
  prefix: {op: choice, values: [atlas, harbor, summit, cedar, lumen, meridian]}
  suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 5}
  name: {op: format, value: '${prefix}-${suffix}'}
  slug: {op: replace, value: '${name}', from: '-', to: ''}
  db: {op: replace, value: '${name}', from: '-', to: '_'}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 28}
  auth_key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  secure_auth_key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  logged_in_key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  nonce_key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  auth_salt: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  secure_auth_salt: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  logged_in_salt: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  nonce_salt: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
template: |
  <?php
  define( 'DB_NAME', 'wp_${db}' );
  define( 'DB_USER', 'wp_${db}_app' );
  define( 'DB_PASSWORD', '${password}' );
  define( 'DB_HOST', 'db.${slug}.local' );
  define( 'DB_CHARSET', 'utf8mb4' );
  define( 'DB_COLLATE', '' );
  define( 'AUTH_KEY', '${auth_key}' );
  define( 'SECURE_AUTH_KEY', '${secure_auth_key}' );
  define( 'LOGGED_IN_KEY', '${logged_in_key}' );
  define( 'NONCE_KEY', '${nonce_key}' );
  define( 'AUTH_SALT', '${auth_salt}' );
  define( 'SECURE_AUTH_SALT', '${secure_auth_salt}' );
  define( 'LOGGED_IN_SALT', '${logged_in_salt}' );
  define( 'NONCE_SALT', '${nonce_salt}' );
  $$table_prefix = 'wp_';
  define( 'WP_DEBUG', false );
  if ( ! defined( 'ABSPATH' ) ) { define( 'ABSPATH', __DIR__ . '/' ); }
  require_once ABSPATH . 'wp-settings.php';
