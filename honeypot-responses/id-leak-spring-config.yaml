version: 1
name: id-leak-spring-config
restype: normal
content_type: application/yaml; charset=utf-8
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  secret: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
template: |
  spring:
    application:
      name: orders-${slug}
    datasource:
      url: jdbc:postgresql://db.${slug}.local:5432/orders
      username: orders_app
      password: ${password}
    data:
      redis:
        host: redis.${slug}.local
        port: 6379
  services:
    billing:
      base-url: https://billing.${slug}.local
      api-key: ${secret}
