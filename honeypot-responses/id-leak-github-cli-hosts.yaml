version: 1
name: id-leak-github-cli-hosts
restype: normal
variables:
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 40}
  user: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 10}
template: |
  github.com:
      user: ${user}
      oauth_token: ${token}
      git_protocol: https
      users:
          ${user}:
              oauth_token: ${token}
