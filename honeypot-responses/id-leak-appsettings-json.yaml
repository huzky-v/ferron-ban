version: 1
name: id-leak-appsettings-json
restype: json
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  password: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 32}
fields:
  ConnectionStrings:
    DefaultConnection: 'Host=db.${slug}.local;Database=app;Username=app;Password=${password}'
  Logging:
    LogLevel:
      Default: Information
