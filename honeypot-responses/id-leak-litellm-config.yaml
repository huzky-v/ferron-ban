version: 1
name: id-leak-litellm-config
restype: normal
variables:
  master: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
template: |
  model_list:
    - model_name: production-chat
      litellm_params:
        model: openai/gpt-4o-mini
        api_key: sk-${key}
  general_settings:
    master_key: sk-${master}
