version: 1
name: id-leak-agent-instructions
restype: normal
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 40}
template: |
  # Internal engineering agent instructions
  # repository: ${slug}
  MCP_GATEWAY=https://agent.${slug}.local/mcp
  MCP_TOKEN=${token}

  - Never print secrets or environment values.
  - Ask before running destructive commands.
