version: 1
name: id-leak-database-dump
restype: normal
variables:
  prefix: {op: choice, values: [atlas, harbor, summit, cedar, lumen, meridian]}
  suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 5}
  name: {op: format, value: '${prefix}-${suffix}'}
  slug: {op: replace, value: '${name}', from: '-', to: ''}
  db: {op: replace, value: '${name}', from: '-', to: '_'}
  hash1: {op: chars, alphabet: './ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', min: 53}
  hash2: {op: chars, alphabet: './ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', min: 53}
  hash3: {op: chars, alphabet: './ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', min: 53}
  token1: {op: chars, alphabet: '0123456789abcdef', min: 64}
  token2: {op: chars, alphabet: '0123456789abcdef', min: 64}
  token3: {op: chars, alphabet: '0123456789abcdef', min: 64}
template: |
  -- MySQL dump 10.13  Distrib 8.0.36, for Linux (x86_64)
  --
  -- Host: db.${slug}.local    Database: ${db}_production
  -- ------------------------------------------------------
  /*!40101 SET @OLD_CHARACTER_SET_CLIENT=@@CHARACTER_SET_CLIENT */;

  DROP TABLE IF EXISTS `${db}_users`;
  CREATE TABLE `${db}_users` (
    `id` bigint unsigned NOT NULL AUTO_INCREMENT,
    `email` varchar(191) NOT NULL,
    `password` varchar(191) NOT NULL,
    `api_token` varchar(191) DEFAULT NULL,
    `created_at` timestamp NULL DEFAULT NULL,
    PRIMARY KEY (`id`),
    UNIQUE KEY `users_email_unique` (`email`)
  ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

  INSERT INTO `${db}_users` VALUES (1,'user0@${slug}.local','$$2y$$10$$${hash1}','${token1}',NOW());
  INSERT INTO `${db}_users` VALUES (2,'user1@${slug}.local','$$2y$$10$$${hash2}','${token2}',NOW());
  INSERT INTO `${db}_users` VALUES (3,'user2@${slug}.local','$$2y$$10$$${hash3}','${token3}',NOW());
