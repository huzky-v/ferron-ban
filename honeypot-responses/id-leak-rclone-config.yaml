version: 1
name: id-leak-rclone-config
restype: normal
variables:
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-., min: 64}
  secret: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-., min: 48}
template: |
  [production]
  type = s3
  provider = AWS
  env_auth = false
  access_key_id = ${token}
  secret_access_key = ${secret}
  region = us-east-1
