version: 1
name: id-leak-azure-cli-config
restype: json
variables:
  tenant: {op: chars, alphabet: '0123456789abcdef', min: 32}
  access: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 80}
  refresh: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 96}
  subscription: {op: chars, alphabet: '0123456789abcdef', min: 32}
fields:
  accessToken: '${access}'
  refreshToken: '${refresh}'
  expiresIn: 3600
  expiresOn: '2030-01-01 00:00:00.000000'
  resource: https://management.core.windows.net/
  tokenType: Bearer
  tenantId: '${tenant}'
  subscriptionId: '${subscription}'
