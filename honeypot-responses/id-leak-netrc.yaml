version: 1
name: id-leak-netrc
restype: normal
variables:
  username: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 12}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
template: |
  machine git.example.invalid
    login ${username}
    password ${password}
