version: 1
name: id-leak-rails-database-yml
restype: normal
content_type: application/yaml; charset=utf-8
variables:
  prefix: {op: choice, values: [atlas, harbor, summit, cedar, lumen, meridian]}
  suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 5}
  name: {op: format, value: '${prefix}-${suffix}'}
  slug: {op: replace, value: '${name}', from: '-', to: ''}
  db: {op: replace, value: '${name}', from: '-', to: '_'}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 28}
template: |
  default: &default
    adapter: postgresql
    encoding: unicode
    pool: 5
    host: db.${slug}.local
  development:
    <<: *default
    database: ${db}_development
    username: ${db}_app
    password: ${password}
  production:
    <<: *default
    database: ${db}_production
    username: ${db}_app
    password: ${password}
