version: 1
name: id-leak-user-secrets-yml
restype: normal
content_type: application/yaml; charset=utf-8
variables:
  user: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 28}
  token: {op: chars, alphabet: '0123456789abcdef', min: 40}
template: |
  users:
    deploy_${user}:
      password: "${password}"
      api_token: "${token}"
