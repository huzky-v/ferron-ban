version: 1
name: id-leak-aws-yaml
restype: normal
content_type: application/yaml; charset=utf-8
variables:
  key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 16}
  secret: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 40}
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
template: |
  aws:
    region: us-east-1
    access_key_id: AKIA${key}
    secret_access_key: ${secret}
    bucket: assets-${slug}
