version: 1
name: id-leak-shell-config
restype: normal
variables:
  key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 16}
  secret: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 40}
template: |
  export AWS_DEFAULT_REGION=us-east-1
  export AWS_ACCESS_KEY_ID=AKIA${key}
  export AWS_SECRET_ACCESS_KEY=${secret}
