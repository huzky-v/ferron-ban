version: 1
name: id-leak-gemini-auth
restype: json
variables:
  access: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_, min: 48}
  refresh: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_, min: 48}
fields:
  access_token: '${access}'
  refresh_token: '${refresh}'
  expiry_date: 1798761600000
  token_type: Bearer
  scope: https://www.googleapis.com/auth/generative-language
