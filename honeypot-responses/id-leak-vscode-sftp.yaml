version: 1
name: id-leak-vscode-sftp
restype: json
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 24}
fields:
  name: 'staging-${slug}'
  host: 'sftp.${slug}.local'
  protocol: sftp
  port: 22
  username: deploy
  password: '${password}'
  remotePath: '/var/www/${slug}'
