version: 1
name: id-leak-oci-config
restype: normal
variables:
  tenancy: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 16}
  user: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 16}
  fingerprint: {op: chars, alphabet: '0123456789abcdef', min: 32}
  key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
template: |
  [DEFAULT]
  user=ocid1.user.oc1..${user}
  fingerprint=${fingerprint}
  tenancy=ocid1.tenancy.oc1..${tenancy}
  region=us-ashburn-1
  key_file=~/.oci/oci_api_key.pem

  [PRODUCTION]
  user=ocid1.user.oc1..${user}
  fingerprint=${fingerprint}
  tenancy=ocid1.tenancy.oc1..${tenancy}
  region=us-ashburn-1
  key_content=${key}
