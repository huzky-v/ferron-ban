version: 1
name: id-leak-frontpage-password
restype: normal
variables:
  user: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  hash: {op: chars, alphabet: './ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', min: 53}
template: |
  # -FrontPage-
  webadmin_${user}:$$2y$$10$$${hash}
