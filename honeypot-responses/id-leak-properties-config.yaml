version: 1
name: id-leak-properties-config
restype: normal
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  password: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 32}
template: |
  jdbc.url=jdbc:postgresql://db.${slug}.local:5432/portal
  jdbc.username=portal
  jdbc.password=${password}
