version: 1
name: id-leak-kube-config
restype: normal
content_type: application/yaml; charset=utf-8
variables:
  prefix: {op: choice, values: [atlas, harbor, summit, cedar, lumen, meridian]}
  suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 5}
  name: {op: format, value: '${prefix}-${suffix}'}
  slug: {op: replace, value: '${name}', from: '-', to: ''}
  cluster: {op: format, value: '${name}-production'}
  context: {op: format, value: '${cluster}-deploy'}
  user: {op: format, value: 'deploy-${cluster}'}
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
template: |
  apiVersion: v1
  kind: Config
  clusters:
  - name: ${cluster}
    cluster:
      server: https://api.${slug}.local:6443
  contexts:
  - name: ${context}
    context:
      cluster: ${cluster}
      namespace: default
      user: ${user}
  current-context: ${context}
  users:
  - name: ${user}
    user:
      token: ${token}
