version: 1
name: id-leak-jupyter-yaml-config
restype: normal
content_type: application/yaml; charset=utf-8
variables:
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
template: |
  JupyterHub:
    bind_url: http://0.0.0.0:8000
    authenticator_class: pam
    proxy_auth_token: ${token}
