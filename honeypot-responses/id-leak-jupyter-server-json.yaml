version: 1
name: id-leak-jupyter-server-json
restype: json
variables:
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
fields:
  ServerApp:
    ip: 0.0.0.0
    port: 8888
    open_browser: false
    token: '${token}'
    password: '${password}'
