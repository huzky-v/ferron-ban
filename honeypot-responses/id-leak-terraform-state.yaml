version: 1
name: id-leak-terraform-state
restype: json
variables:
  prefix: {op: choice, values: [atlas, harbor, summit, cedar, lumen, meridian]}
  suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 5}
  name: {op: format, value: '${prefix}-${suffix}'}
  slug: {op: replace, value: '${name}', from: '-', to: ''}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 28}
  api_key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  lineage: {op: chars, alphabet: '0123456789abcdef', min: 32}
fields:
  version: 4
  terraform_version: 1.9.0
  serial: 12
  lineage: '${lineage}'
  outputs:
    service_api_key: {value: 'sk_live_${api_key}', type: string, sensitive: true}
  resources:
    - mode: managed
      type: aws_db_instance
      name: primary
      provider: 'provider["registry.terraform.io/hashicorp/aws"]'
      instances:
        - schema_version: 0
          attributes:
            identifier: '${name}-db'
            username: application
            password: '${password}'
            endpoint: 'db.${slug}.local'
            port: 5432
          sensitive_attributes: []
