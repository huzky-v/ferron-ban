version: 1
name: id-leak-dotenv
restype: normal
variables:
  prefix: {op: choice, values: [atlas, harbor, summit, cedar, lumen, meridian]}
  suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 5}
  name: {op: format, value: '${prefix}-${suffix}'}
  slug: {op: replace, value: '${name}', from: '-', to: ''}
  db_name: {op: replace, value: '${name}', from: '-', to: '_'}
  app_key: {op: bytes_base64, length: 32}
  db_password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 28}
  redis_password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 24}
  mail_password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 20}
  aws_id: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 16}
  aws_secret: {op: chars, alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/', min: 40}
  stripe_pub: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 24}
  stripe_secret: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  jwt: {op: bytes_base64, length: 48}
  session: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 40}
template: |
  APP_NAME=${name}
  APP_ENV=production
  APP_KEY=base64:${app_key}
  APP_DEBUG=false
  APP_URL=https://app.${slug}.local

  DB_CONNECTION=mysql
  DB_HOST=db.${slug}.local
  DB_PORT=3306
  DB_DATABASE=${db_name}_production
  DB_USERNAME=${db_name}_app
  DB_PASSWORD=${db_password}

  REDIS_HOST=redis.${slug}.local
  REDIS_PORT=6379
  REDIS_PASSWORD=${redis_password}

  MAIL_MAILER=smtp
  MAIL_HOST=smtp.${slug}.local
  MAIL_PORT=587
  MAIL_USERNAME=mailer@${slug}.local
  MAIL_PASSWORD=${mail_password}

  AWS_ACCESS_KEY_ID=AKIA${aws_id}
  AWS_SECRET_ACCESS_KEY=${aws_secret}
  AWS_DEFAULT_REGION=us-east-1
  AWS_BUCKET=${name}-assets

  STRIPE_KEY=pk_live_${stripe_pub}
  STRIPE_SECRET=sk_live_${stripe_secret}

  JWT_SECRET=${jwt}
  SESSION_SECRET=${session}
