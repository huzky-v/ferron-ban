version: 1
name: id-leak-aws-credentials
restype: normal
variables:
  profile: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  temporary: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 16}
  default_secret: {op: chars, alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/', min: 40}
  token: {op: bytes_base64, length: 192}
  key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789, min: 16}
  secret: {op: chars, alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/', min: 40}
template: |
  [default]
  aws_access_key_id = ASIA${temporary}
  aws_secret_access_key = ${default_secret}
  aws_session_token = ${token}

  [${profile}]
  aws_access_key_id = AKIA${key}
  aws_secret_access_key = ${secret}
