version: 1
name: id-leak-streamlit-secrets
restype: normal
variables:
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  api_key: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 40}
template: |
  [database]
  host = "db.atlas.local"
  username = "streamlit_app"
  password = "${password}"

  [api]
  endpoint = "https://api.atlas.local"
  key = "${api_key}"
