version: 1
name: id-leak-symfony-parameters
restype: normal
content_type: application/yaml; charset=utf-8
variables:
  prefix: {op: choice, values: [atlas, harbor, summit, cedar, lumen, meridian]}
  suffix: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 5}
  name: {op: format, value: '${prefix}-${suffix}'}
  slug: {op: replace, value: '${name}', from: '-', to: ''}
  secret: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 28}
  mailer: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 24}
template: |
  parameters:
      database_host: 127.0.0.1
      database_port: 3306
      database_name: ${slug}
      database_user: ${slug}
      database_password: ${password}
      mailer_transport: smtp
      mailer_host: 127.0.0.1
      mailer_user: ${mailer}
      mailer_password: ${password}
      secret: ${secret}
      locale: en
      debug: false
