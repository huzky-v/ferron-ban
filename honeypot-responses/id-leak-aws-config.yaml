version: 1
name: id-leak-aws-config
restype: normal
variables:
  region: {op: choice, values: [us-east-1, us-west-2, eu-west-1]}
  account: {op: chars, alphabet: '0123456789', min: 12}
  role: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
template: |
  [default]
  region = ${region}
  output = json

  [profile production]
  role_arn = arn:aws:iam::${account}:role/deploy-${role}
  source_profile = default
  region = ${region}
