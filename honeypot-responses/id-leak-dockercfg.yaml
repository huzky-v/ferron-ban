version: 1
name: id-leak-dockercfg
restype: json
variables:
  user: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 10}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  auth: {op: base64, value: '${user}:${password}'}
fields:
  'https://index.docker.io/v1/':
    auth: '${auth}'
    email: '${user}@${slug}.local'
