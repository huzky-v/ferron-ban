version: 1
name: id-leak-actuator-env
restype: json
variables:
  slug: {op: chars, alphabet: abcdefghijklmnopqrstuvwxyz0123456789, min: 8}
  password: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 32}
fields:
  activeProfiles: [production]
  propertySources:
    - name: 'Config resource class path resource [application.yml] via location optional:classpath:/'
      properties:
        spring.application.name: {value: 'orders-${slug}'}
        spring.datasource.url: {value: 'jdbc:postgresql://db.${slug}.local:5432/orders'}
        spring.datasource.username: {value: orders_app}
        spring.datasource.password: {value: '${password}'}
