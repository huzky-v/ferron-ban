version: 1
name: id-leak-pypirc
restype: normal
variables:
  token: {op: chars, alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789, min: 48}
template: |
  [distutils]
  index-servers =
      pypi

  [pypi]
  repository = https://upload.pypi.org/legacy/
  username = __token__
  password = pypi-${token}
